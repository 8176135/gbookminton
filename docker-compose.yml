services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: gbookminton:latest
    container_name: gbookminton
    init: true
    runtime: runsc
    user: "1000:1000"
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - PORT=3000
      - DATABASE_PATH=/app/data/local.db
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    # deploy:
    #   resources:
    #     limits:
